<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>bera-notes-app</title>
  </head>
  <body>
    <main>
      <h1>Bera Notes</h1>

    </main>
    <script src="/app.js"></script>
  </body>
</html>
